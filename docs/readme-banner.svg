    <path d="M32 350c25-88 42-153 57-224" fill="none" stroke="#d9f5ae" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f5fff0">
