<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">DahonMD banner</title>
  <desc id="desc">Green banana leaves and a leaf inside a scan frame on a dark green background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#082f24"/>
      <stop offset="1" stop-color="#176144"/>
    </linearGradient>
    <linearGradient id="leaf" x2=".8" y2="1">
      <stop stop-color="#c7ed79"/>
      <stop offset=".55" stop-color="#6ebd58"/>
      <stop offset="1" stop-color="#27874e"/>
    </linearGradient>
    <linearGradient id="glow" x2="1" y2="0">
      <stop stop-color="#b7e888" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b7e888" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="90" cy="265" r="210" fill="url(#glow)"/>
  <circle cx="1090" cy="45" r="210" fill="url(#glow)"/>

  <g opacity=".88" transform="translate(-18 12)">
