name: Quality gates

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and style
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: composer quality

  web:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  ai:
    name: AI protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - run: python -m pip install -r ai/requirements.txt
      - run: python -m unittest discover -s ai/tests -v

  readme-lock:
    name: Root README lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the root README changed
        run: |
          EXPECTED="68071aae3edda2f78c2652f729b6676d8c386422"
          ACTUAL="$(git hash-object README.md)"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::The root README.md is protected and must not be changed."
            echo "It is intentionally frozen (run commands + project overview)."
            echo "expected blob: $EXPECTED"
            echo "actual blob:   $ACTUAL"
            exit 1
          fi
