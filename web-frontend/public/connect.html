<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect DahonMD</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { --green: #236b4b; --ink: #1d2d24; --muted: #68736d; --soft: #f4f7f2; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--soft); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { width: 100%; max-width: 360px; display: grid; gap: 16px; justify-items: center; }
    img { width: 88px; height: 88px; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    a.button { display: block; width: 100%; padding: 15px 18px; border-radius: 14px; background: var(--green); color: #fff; font-weight: 800; font-size: 16px; text-decoration: none; }
    a.secondary { color: var(--green); font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/dahonmd-logo-green.webp" alt="DahonMD">
    <h1>Connect the app</h1>
    <p>Tap the button to point the DahonMD app on this phone to this server.</p>
    <a class="button" id="open-app" href="#">Open DahonMD app</a>
    <a class="secondary" href="/">Use the website instead</a>
  </main>
  <script src="/connect.js"></script>
</body>
</html>
